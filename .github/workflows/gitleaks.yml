name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # forge has no mirror of gitleaks-action; the binary works on GitHub and
      # forge. Checksums from the v8.30.1 release checksums file.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x64; sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64|arm64) arch=arm64; sha256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "unsupported runner arch: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sha256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan for committed secrets
        run: '"${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .'
